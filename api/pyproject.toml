[project]
name = "amazonvision"
version = "0.1.0"
description = "AmazonVision 4.0 — serviço local de inspeção visual e controle da bancada"
authors = [
    { name = "Diego", email = "diegosouzzzza37@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.146.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
amazonvision = "amazonvision.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "onnx>=1.23.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ziglang==0.13.0.post1",
]
training = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

# PyTorch only for training (group "training"). CPU build by default so it installs anywhere;
# the RTX notebook can switch the index to a CUDA build (docs/treinamento.md).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Simulation randomness is not security-sensitive.
"src/amazonvision/simulation/*" = ["S311"]
"src/amazonvision/training/*" = ["S311"]
# Tests run the locally built firmware binaries.
"tests/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
