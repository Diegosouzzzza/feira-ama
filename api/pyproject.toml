[project]
name = "amazonvision"
version = "0.1.0"
description = "AmazonVision 4.0 — serviço local de inspeção visual e controle da bancada"
authors = [
    { name = "Diego", email = "diegosouzzzza37@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.146.0",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
amazonvision = "amazonvision.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Simulation randomness is not security-sensitive.
"src/amazonvision/simulation/*" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
