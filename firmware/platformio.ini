; AmazonVision 4.0 — firmware do ESP32
; Versões fixadas: atualizar só de forma deliberada e registrar em docs/adr.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; espressif32 7.0.1 = Arduino-ESP32 core 2.0.17 (linha estável oficial do PlatformIO)
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D AV_FIRMWARE_VERSION=\"0.2.0\"
    -D AV_SERIAL_BAUD=115200
; Pinos e driver do motor: ver src/board_config.h (valores provisórios até a montagem).
